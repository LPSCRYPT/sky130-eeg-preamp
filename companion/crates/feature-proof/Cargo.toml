[package]
name = "bci-feature-proof"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bci-signal-core = { path = "../signal-core" }
bulletproofs = "=5.0.0"
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "zeroize"] }
merlin = "=3.0.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
zeroize = "1.8"
