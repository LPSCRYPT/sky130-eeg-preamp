<svg xmlns="http://www.w3.org/2000/svg" width="840" height="342" viewBox="0 0 840 342" role="img" aria-labelledby="title desc">
  <title id="title">Proposed package measurement connections; logical ports, not assigned pins</title>
  <desc id="desc">Guarded P and N sources each use a series resistor and a dedicated pad. External VCM enters on shared line 3. Separate non-inverting buffers send OUTP and OUTN to synchronous high-impedance readout on lines 1 and 2. Current leaves IREF_SINK and flows down an NMOS to AVSS. Independently, the harness current source feeds a diode-connected NMOS. Its drain sets the gate voltage of both NMOS devices. All returns share AVSS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#243e4d"/></marker>
  </defs>
  <rect width="840" height="342" fill="white"/>
  <rect x="173" y="3" width="505" height="318" rx="6" fill="#edf5f5" stroke="#84a2a8"/>
  <rect x="4" y="40" width="83" height="167" rx="4" fill="white" stroke="#667780"/>
  <rect x="302" y="35" width="156" height="184" rx="4" fill="white" stroke="#21686c" stroke-width="2"/>
  <rect x="708" y="40" width="127" height="113" rx="4" fill="white" stroke="#667780"/>
  <rect x="502" y="166" width="151" height="47" rx="4" fill="white" stroke="#21686c"/>
  <g fill="white" stroke="#21686c" stroke-width="2">
    <path d="M491 62L540 80L491 98Z"/><path d="M491 101L540 119L491 137Z"/>
  </g>
  <g fill="none" stroke="#243e4d" stroke-width="1.8" stroke-linejoin="round">
    <!-- Independent synthetic source legs; only these two boundary squares are dedicated pads. -->
    <g marker-end="url(#arrow)">
      <path d="M87 80H99l4 -6 6 12 6 -12 6 12 4 -6H302"/>
      <path d="M87 119H99l4 -6 6 12 6 -12 6 12 4 -6H302"/>
      <path d="M87 158H302"/><path d="M87 194H302"/>
      <path d="M458 80H491"/><path d="M458 119H491"/>
      <path d="M540 80H708"/><path d="M540 119H708"/>
    </g>
    <g fill="white"><rect x="168" y="75" width="10" height="10"/><rect x="168" y="114" width="10" height="10"/></g>
    <!-- Conventional current in each drain is downward. The reference drain is tied to both gates. -->
    <g marker-end="url(#arrow)"><path d="M409 219V250"/><path d="M570 213V250"/></g>
    <path d="M409 250v7h16m0 -6v33m0 -7h-16v37m23 -60v27"/>
    <path d="M570 250v7h-16m0 -6v33m0 -7h16v37m-23 -60v27"/>
    <path d="M432 267H547M570 237H531V267"/>
    <!-- One return net, including the supply/drive unit and recorder common. -->
    <path d="M27 207V314H821V153M323 219V314"/>
  </g>
  <g fill="#243e4d"><circle cx="570" cy="237" r="3"/><circle cx="531" cy="267" r="3"/><circle cx="323" cy="314" r="3"/><circle cx="409" cy="314" r="3"/><circle cx="570" cy="314" r="3"/></g>
  <g fill="#173846" font-family="sans-serif" font-size="15">
    <g font-size="17" font-weight="bold"><text x="4" y="24">Bench drive</text><text x="188" y="24">Proposed harness · logical connections only</text><text x="708" y="24">DC recorder</text></g>
    <g text-anchor="middle">
      <text x="380" y="56" font-size="17" font-weight="bold">Rev G core</text>
      <text x="46" y="85">Source +</text><text x="46" y="124">Source −</text><text x="46" y="163">1.65 V</text><text x="46" y="199">3.3 V</text>
      <text x="112" y="68">RP</text><text x="112" y="107">RN</text>
      <text x="506" y="85">+1</text><text x="506" y="124">+1</text>
      <text x="578" y="185">Harness current</text><text x="578" y="203">reference source</text>
      <text x="489" y="288">NMOS mirror</text>
      <text x="420" y="336" font-weight="bold">AVSS · single analog return for fixture, core, bias adapter and recorder</text>
    </g>
    <text x="186" y="72">Dedicated pad</text><text x="186" y="111">Dedicated pad</text>
    <text x="186" y="150">Line 3 · mux</text><text x="186" y="186">Slot supply</text>
    <text x="310" y="85">VINP</text><text x="310" y="124">VINN</text><text x="310" y="163">VCM</text><text x="310" y="199">AVDD</text>
    <text x="310" y="215" font-size="14">AVSS</text>
    <g text-anchor="end"><text x="450" y="85">OUTP</text><text x="450" y="124">OUTN</text><text x="450" y="213">IREF_SINK</text></g>
    <text x="568" y="72">Line 1 · mux</text><text x="568" y="111">Line 2 · mux</text>
    <text x="719" y="85">P channel</text><text x="719" y="124">N channel</text><text x="719" y="146">High Z · DC</text>
    <text x="686" y="190">Read P − N</text><text x="686" y="211">synchronously</text>
    <text x="686" y="261">Line 4 unused</text>
    <text x="418" y="239">8 µA out</text><text x="400" y="273" text-anchor="end">Sink leg</text><text x="580" y="273">Diode leg</text>
  </g>
</svg>
